name: EIKEN difficulty distribution
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/eiken-distribution.yml'
      - 'vocabulary/tools/analyze_eiken_distribution.py'
jobs:
  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frequency data library
        run: pip install wordfreq==3.1.1
      - name: Analyze CEFR and Zipf frequency distributions
        run: python vocabulary/tools/analyze_eiken_distribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: eiken-distribution-summary
          path: vocabulary/analysis/eiken-distribution-summary.json
