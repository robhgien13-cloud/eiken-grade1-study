name: Audit external EIKEN vocabulary metadata
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-eiken-vocab.yml'
      - 'vocabulary/tools/audit_eiken_vocab.py'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit upstream metadata (summary only)
        run: python vocabulary/tools/audit_eiken_vocab.py
