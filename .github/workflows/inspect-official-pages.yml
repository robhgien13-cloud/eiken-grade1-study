name: Inspect official EIKEN PDF page boundaries
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-official-pages.yml'
      - 'vocabulary/tools/inspect_official_pages.py'
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pymupdf==1.26.4
      - run: python vocabulary/tools/inspect_official_pages.py
