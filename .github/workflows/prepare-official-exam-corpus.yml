name: Prepare official EIKEN exam corpus
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/prepare-official-exam-corpus.yml'
      - 'vocabulary/tools/prepare_official_exam_corpus.py'
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pymupdf==1.26.4 wordfreq==3.1.1 simplemma==1.1.2
      - run: python vocabulary/tools/prepare_official_exam_corpus.py
      - uses: actions/upload-artifact@v4
        with:
          name: cleaned-exam-aggregates
          path: vocabulary/analysis/official-exam-cleaning-aggregates.json
